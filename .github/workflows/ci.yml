name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Run tests with coverage (minimum 80%)
        run: pytest --cov=smishguard --cov-report=term-missing --cov-fail-under=80

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      # Same pinned versions as the image, so the pickled demo model loads inside it.
      - name: Train demo model on the test fixture
        run: |
          pip install -r requirements-lock.txt
          pip install --no-deps -e .
          pip install "pandas>=2.2"   # only to read the fixture CSV; not part of the pickle
          python scripts/train_demo_model.py --output demo-models

      - name: Build image
        run: docker build -t smishguard:ci .

      - name: Run container and call the API
        run: |
          docker run -d --name smishguard -p 8000:8000 \
            -v "$PWD/demo-models:/app/models:ro" smishguard:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && break
            sleep 1
          done
          curl -fsS http://localhost:8000/health
          curl -fsS -X POST http://localhost:8000/v1/analyze \
            -H "Content-Type: application/json" \
            -d '{"text": "PTT: adres eksik, 24 saat icinde guncelleyin hxxps://ptt-kargo-takip[.]xyz"}' \
            | tee response.json
          grep -q '"risk_level"' response.json
          docker exec smishguard id -u | grep -qx 10001

      - name: Show container logs
        if: always()
        run: docker logs smishguard || true
