[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smishguard-tr"
dynamic = ["version"]
description = "Explainable smishing (SMS phishing) risk analysis for Turkish messages — hybrid ML + rule engine."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Emir Kabacalı" }]
keywords = ["nlp", "turkish", "phishing", "smishing", "machine-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Text Processing :: Linguistic",
]
# Runtime dependencies are added phase by phase, only when the code needs them.
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "tldextract>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
eval = [
    "matplotlib>=3.8",
]
notebooks = [
    "jupyter>=1.0",
    "matplotlib>=3.8",
]

[project.urls]
Repository = "https://github.com/emirkabacali/smishguard-tr"

[tool.setuptools.dynamic]
version = { attr = "smishguard.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: bugbear, UP: pyupgrade, SIM: simplify
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["smishguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
